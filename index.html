<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Beauty China Trip 2026 ✈️</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --red:#C62828;--gold:#F5A623;--deep:#1a0800;--cream:#FFF9F3;--white:#fff;
  --muted:#7A6045;--border:#EDE0CE;--teal:#00695C;--navy:#1A237E;
  --map-h:calc(100vh - 108px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--cream);color:var(--deep);line-height:1.55}

/* ─── HERO ─────────────────────────────────────── */
.hero{
  background:linear-gradient(135deg,#7B0E0E 0%,#C62828 45%,#E53935 70%,#F5A623 100%);
  color:#fff;padding:44px 20px 52px;text-align:center;position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;inset:0;
  background:url("data:image/svg+xml,%3Csvg width='56' height='56' viewBox='0 0 56 56' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23fff' fill-opacity='0.05'%3E%3Cpath d='M28 0L56 28L28 56L0 28z'/%3E%3C/g%3E%3C/svg%3E") repeat;
  pointer-events:none;
}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(1.7rem,5vw,2.8rem);font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.3);margin-bottom:6px}
.hero-sub{opacity:.9;font-size:.95rem;margin-bottom:20px}
.hero-pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pill{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:50px;padding:6px 16px;font-size:.78rem;font-weight:600;backdrop-filter:blur(6px)}
.pill span{font-weight:700}

/* ─── DAY NAV ───────────────────────────────────── */
#day-nav{
  display:flex;overflow-x:auto;background:#fff;border-bottom:2px solid var(--border);
  position:sticky;top:0;z-index:900;box-shadow:0 2px 10px rgba(0,0,0,.08);
  scrollbar-width:none;
}
#day-nav::-webkit-scrollbar{display:none}
.dnav-btn{
  flex-shrink:0;padding:12px 16px;cursor:pointer;border:none;background:none;
  font-family:'Inter',sans-serif;font-size:.78rem;font-weight:600;color:var(--muted);
  border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap;
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.dnav-btn .d-date{font-size:.85rem;font-weight:700;color:var(--deep)}
.dnav-btn .d-label{font-size:.65rem;opacity:.7}
.dnav-btn.active{color:var(--red);border-bottom-color:var(--red)}
.dnav-btn.active .d-date{color:var(--red)}
.dnav-btn:hover:not(.active){color:var(--red);background:#fff5f5}

/* ─── MAIN LAYOUT ───────────────────────────────── */
#main{display:grid;grid-template-columns:42% 58%;height:var(--map-h)}
#map-panel{position:sticky;top:108px;height:var(--map-h);display:flex;flex-direction:column}
#map{flex:1;z-index:1}
#map-footer{
  background:#fff;border-top:1px solid var(--border);padding:8px 14px;
  display:flex;align-items:center;justify-content:space-between;
  font-size:.75rem;color:var(--muted);gap:8px;flex-shrink:0;
}
.map-toggle{
  background:var(--red);color:#fff;border:none;border-radius:6px;
  padding:4px 12px;font-size:.72rem;font-weight:600;cursor:pointer;
}
#timeline{overflow-y:auto;height:var(--map-h);background:var(--cream);padding:0 16px 40px}

/* ─── DAY HEADER ────────────────────────────────── */
.day-hdr{
  background:#fff;border-bottom:2px solid var(--border);
  padding:16px;margin:0 -16px 20px;position:sticky;top:0;z-index:10;
}
.day-hdr-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
/* ── Weather bar ─────────────────────────── */
.wx-bar{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:8px 14px;margin:8px 0 2px;background:linear-gradient(90deg,rgba(77,158,136,.10) 0%,rgba(239,248,244,.6) 100%);border-radius:10px 3px 10px 3px;border:1.5px dashed var(--border);font-size:.82rem}
.wx-icon{font-size:1.3rem}
.wx-temp{font-weight:700;color:var(--navy);font-size:.95rem;font-family:'Caveat',cursive}
.wx-sep{color:var(--border);font-size:1rem}
.wx-chip{padding:2px 8px;border-radius:20px;font-size:.74rem;font-weight:600}
.wx-rain{background:rgba(100,149,237,.15);color:#3355AA}
.wx-hum{background:rgba(77,158,136,.15);color:var(--teal)}
.wx-desc{color:var(--muted);font-style:italic;font-size:.78rem;margin-left:2px}
.day-badge{
  background:var(--red);color:#fff;border-radius:8px;
  padding:6px 14px;font-size:.8rem;font-weight:700;flex-shrink:0;
}
.day-badge.class-day{background:#4A148C}
.day-badge.gz{background:var(--teal)}
.day-badge.travel{background:#37474F}
.day-title-wrap .dt-main{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;color:var(--deep)}
.day-title-wrap .dt-sub{font-size:.78rem;color:var(--muted);margin-top:2px}
.hotel-bar{
  margin-top:10px;background:#F3F8FF;border:1px solid #BBDEFB;border-radius:8px;
  padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:.8rem;
}
.hotel-bar .hb-icon{font-size:18px;flex-shrink:0}
.hotel-bar .hb-name{font-weight:600;color:var(--navy)}
.hotel-bar .hb-note{color:var(--muted);font-size:.72rem}

/* ─── ACTIVITY CARDS ────────────────────────────── */
.act-list{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.act-card{
  background:#fff;border:1px solid var(--border);border-radius:14px;
  overflow:hidden;cursor:pointer;transition:all .2s;box-shadow:0 1px 6px rgba(0,0,0,.04);
}
.act-card:hover,.act-card.highlighted{border-color:var(--red);box-shadow:0 3px 16px rgba(198,40,40,.15)}
.act-inner{display:flex;gap:12px;padding:12px 14px}
.act-left{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;min-width:48px}
.act-time{font-size:.68rem;font-weight:700;color:var(--red);white-space:nowrap}
.act-icon-wrap{
  width:36px;height:36px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:18px;flex-shrink:0;
}
.type-transport{background:#ECEFF1}
.type-hotel{background:#E3F2FD}
.type-activity{background:#FFF3E0}
.type-food{background:#FFF8E1}
.type-class{background:#EDE7F6}
.type-night{background:#E8EAF6}
.act-body{flex:1;min-width:0}
.act-name-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:2px}
.act-name{font-weight:600;font-size:.92rem;color:var(--deep)}
.act-cost{
  background:#FFF3CD;border:1px solid #FFD54F;border-radius:6px;
  padding:2px 8px;font-size:.7rem;font-weight:700;color:#E65100;flex-shrink:0;
}
.act-zh{font-size:.75rem;color:var(--muted);margin-bottom:6px}
.act-img-wrap{
  width:100%;height:160px;border-radius:8px;overflow:hidden;
  margin-bottom:8px;background:#f5f5f5;
}
.act-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .3s}
.act-img-wrap img[src=""]{display:none}
.act-desc{font-size:.82rem;color:#4A3928;line-height:1.5;margin-bottom:6px}
.act-transport{
  font-size:.75rem;color:var(--teal);background:#E8F5E9;
  border-radius:6px;padding:4px 8px;margin-bottom:6px;
}
.act-warn{
  font-size:.75rem;color:#7B1FA2;background:#F3E5F5;
  border-left:3px solid #AB47BC;border-radius:0 6px 6px 0;
  padding:6px 10px;margin-bottom:6px;line-height:1.4;
}
.act-warn strong{display:block;margin-bottom:2px}
.act-actions{display:flex;gap:6px;flex-wrap:wrap}
.btn-amap{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--cream);border:1px solid var(--gold);
  color:#8B5E00;border-radius:8px;padding:4px 10px;
  font-size:.73rem;font-weight:600;text-decoration:none;transition:all .2s;
}
.btn-amap:hover{background:var(--gold);color:#fff}

/* ─── FOOD SECTION ──────────────────────────────── */
.food-section{margin-top:8px}
.food-section-title{
  font-size:.8rem;font-weight:700;color:#E65100;
  text-transform:uppercase;letter-spacing:.5px;
  display:flex;align-items:center;gap:6px;margin-bottom:12px;
}
.food-scroll{
  display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;
  scrollbar-width:none;
}
.food-scroll::-webkit-scrollbar{display:none}
.food-card{
  flex-shrink:0;width:180px;background:#fff;border:1px solid var(--border);
  border-radius:12px;overflow:hidden;
}
.food-card-img{width:100%;height:120px;object-fit:cover;display:block;background:#f5f0e8}
.food-card-body{padding:10px}
.food-card-name{font-weight:600;font-size:.82rem;color:var(--deep);margin-bottom:3px}
.food-card-zh{font-size:.7rem;color:var(--muted);margin-bottom:4px}
.food-card-desc{font-size:.72rem;color:#6B5040;line-height:1.4;margin-bottom:6px}
.food-card-price{
  font-size:.72rem;font-weight:700;color:#C62828;
  background:#FFF3E0;border-radius:4px;padding:2px 6px;display:inline-block;
}

/* ─── TIPS BOX ──────────────────────────────────── */
.tips-box{
  background:linear-gradient(135deg,#E8F5E9,#F1F8E9);
  border-left:4px solid #43A047;border-radius:0 12px 12px 0;
  padding:12px 16px;margin-top:16px;font-size:.82rem;color:#1B5E20;
  line-height:1.5;
}
.tips-box h4{font-weight:700;margin-bottom:6px}
.tips-box ul{padding-left:16px}
.tips-box li{margin-bottom:4px}

/* ─── MAP POPUPS ────────────────────────────────── */
.leaflet-popup-content-wrapper{border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.map-pop{font-family:'Inter',sans-serif;min-width:200px;max-width:240px}
.map-pop .pop-name{font-weight:700;font-size:.9rem;color:var(--deep);margin-bottom:2px}
.map-pop .pop-zh{font-size:.75rem;color:var(--muted);margin-bottom:6px}
.map-pop .pop-time{font-size:.75rem;color:var(--red);font-weight:600;margin-bottom:4px}
.map-pop .pop-warn{font-size:.72rem;color:#7B1FA2;background:#F3E5F5;border-radius:4px;padding:4px 6px;margin-bottom:6px}
.map-pop a{
  display:block;text-align:center;background:var(--red);color:#fff;
  border-radius:6px;padding:6px;font-size:.75rem;font-weight:600;text-decoration:none;margin-top:6px;
}

/* ─── RESPONSIVE ────────────────────────────────── */
@media(max-width:768px){
  #main{grid-template-columns:1fr;height:auto}
  #map-panel{position:relative;top:0;height:320px}
  #timeline{height:auto;overflow-y:visible}
  :root{--map-h:320px}
}

/* ─── SPECIAL TABS (Book/Wellness) ─────────────────── */
.dnav-btn.special-tab{border-bottom-color:transparent}
.dnav-btn.special-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.dnav-btn.special-tab.active .d-date{color:var(--gold)}
.dnav-btn.special-tab:hover:not(.active){color:var(--gold);background:#FFFDE7}
.dnav-sep{width:1px;background:var(--border);flex-shrink:0;margin:8px 4px}

/* ─── BOOKING CARDS ──────────────────────────────── */
.spec-section{padding:0 0 40px}
.spec-city-hdr{
  display:flex;align-items:center;gap:12px;
  padding:18px 0 14px;border-bottom:2px solid var(--border);margin-bottom:16px;
}
.spec-city-hdr .city-icon{font-size:28px}
.spec-city-hdr h3{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--deep)}
.spec-city-hdr p{font-size:.78rem;color:var(--muted);margin-top:2px}
.booking-grid{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.booking-card{
  background:#fff;border:1px solid var(--border);border-radius:14px;
  overflow:hidden;display:flex;gap:0;
}
.booking-urgency{
  width:6px;flex-shrink:0;border-radius:14px 0 0 14px;
}
.urgency-critical{background:#C62828}
.urgency-advance{background:#F5A623}
.urgency-walkin{background:#43A047}
.booking-body{padding:12px 14px;flex:1}
.booking-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px}
.booking-name{font-weight:700;font-size:.95rem;color:var(--deep)}
.booking-price{
  background:#FFF3E0;border:1px solid #FFB74D;border-radius:6px;
  padding:2px 8px;font-size:.72rem;font-weight:700;color:#E65100;flex-shrink:0;
}
.booking-type{font-size:.75rem;color:var(--muted);margin-bottom:6px}
.booking-stars{font-size:.82rem;margin-bottom:6px}
.booking-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.booking-badge{
  display:inline-flex;align-items:center;gap:4px;border-radius:6px;
  padding:3px 8px;font-size:.72rem;font-weight:600;
}
.badge-when{background:#FFEBEE;color:#C62828}
.badge-how{background:#E3F2FD;color:#1565C0}
.badge-best{background:#E8F5E9;color:#2E7D32}
.booking-note{font-size:.75rem;color:var(--muted);line-height:1.5;margin-bottom:6px;font-style:italic}
.booking-actions{display:flex;gap:6px;flex-wrap:wrap}
.book-now-btn{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--red);color:#fff;border-radius:8px;
  padding:5px 12px;font-size:.75rem;font-weight:600;text-decoration:none;
}
.book-dianping-btn{
  display:inline-flex;align-items:center;gap:4px;
  background:#FF5000;color:#fff;border-radius:8px;
  padding:5px 12px;font-size:.75rem;font-weight:600;text-decoration:none;
}

/* ─── WELLNESS CARDS ─────────────────────────────── */
.wellness-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:24px}
.wellness-card{
  background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}
.wellness-img{width:100%;height:140px;object-fit:cover;display:block;background:#f5f0f5}
.wellness-body{padding:12px 14px}
.wellness-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:3px}
.wellness-name{font-weight:700;font-size:.95rem;color:var(--deep)}
.wellness-price{
  background:#F3E5F5;border:1px solid #CE93D8;border-radius:6px;
  padding:2px 8px;font-size:.72rem;font-weight:700;color:#7B1FA2;flex-shrink:0;
}
.wellness-type{font-size:.75rem;color:var(--muted);margin-bottom:6px}
.wellness-rating{font-size:.82rem;margin-bottom:6px}
.wellness-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.w-badge{
  border-radius:6px;padding:3px 8px;font-size:.72rem;font-weight:600;
}
.wb-treat{background:#EDE7F6;color:#6A1B9A}
.wb-book{background:#E3F2FD;color:#1565C0}
.wb-best{background:#E8F5E9;color:#2E7D32}
.wellness-desc{font-size:.8rem;color:#4A3928;line-height:1.5;margin-bottom:8px}
.wellness-actions{display:flex;gap:6px;flex-wrap:wrap}
.book-wellness-btn{
  display:inline-flex;align-items:center;gap:4px;
  background:#7B1FA2;color:#fff;border-radius:8px;
  padding:5px 12px;font-size:.75rem;font-weight:600;text-decoration:none;
}

/* ─── BOOKING LEGEND ────────────────────────────── */
.book-legend{
  display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px;
  background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;
}
.leg-item{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* ─── EXPENSES TRACKER ───────────────────────────── */
.exp-settle{background:linear-gradient(135deg,#E8F5E9,#F3E5F5);border:2px solid #A5D6A7;border-radius:16px;padding:16px;margin-bottom:16px}
.exp-settle-title{font-size:.75rem;font-weight:700;color:#4A4A4A;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;text-align:center}
.exp-settle-persons{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:12px}
.exp-person-card{background:#fff;border-radius:12px;padding:10px 12px;text-align:center;border:2px solid transparent}
.exp-person-card.ivy{border-color:#CE93D8}.exp-person-card.me{border-color:#80CBC4}
.exp-person-name{font-size:.72rem;font-weight:700;margin-bottom:2px}
.exp-person-card.ivy .exp-person-name{color:#8E24AA}.exp-person-card.me .exp-person-name{color:#00897B}
.exp-person-paid{font-family:'Caveat',cursive;font-size:1.4rem;font-weight:700;color:var(--deep)}
.exp-person-share{font-size:.68rem;color:var(--muted)}
.exp-settle-arrow{text-align:center;font-size:.75rem;color:var(--muted)}
.exp-settle-verdict{text-align:center;padding:8px 12px;border-radius:10px;font-size:.85rem;font-weight:700}
.exp-settle-verdict.even{background:#E8F5E9;color:#2E7D32}
.exp-settle-verdict.ivy-owes{background:#F3E5F5;color:#6A1B9A}
.exp-settle-verdict.me-owes{background:#E0F2F1;color:#00695C}
.exp-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.exp-summary-card{background:#fff;border:2px solid var(--border);border-radius:14px;padding:12px 14px;text-align:center}
.exp-summary-card .esc-label{font-size:.68rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.exp-summary-card .esc-value{font-family:'Caveat',cursive;font-size:1.7rem;font-weight:700;color:var(--deep);margin-top:2px}
.exp-summary-card .esc-sub{font-size:.68rem;color:var(--muted);margin-top:1px}
.exp-summary-card.highlight{background:linear-gradient(135deg,var(--mint-light),#fff);border-color:var(--teal)}
.exp-summary-card.highlight .esc-value{color:var(--teal)}
.exp-add-btn{width:100%;padding:13px;background:var(--teal);color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:16px;border-bottom:3px solid rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;gap:8px}
.exp-add-btn:active{transform:translateY(1px);border-bottom-width:1px}
.exp-form{background:#fff;border:2px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;display:none}
.exp-form.open{display:block}
.exp-form h4{font-family:'Playfair Display',serif;font-size:1rem;color:var(--deep);margin-bottom:12px}
.exp-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.exp-row.full{grid-template-columns:1fr}
.exp-form label{font-size:.75rem;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
.exp-form input,.exp-form select{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:.9rem;background:#FAFAFA;box-sizing:border-box;font-family:inherit}
.exp-form input:focus,.exp-form select:focus{outline:none;border-color:var(--teal);background:#fff}
.exp-who-toggle{display:flex;gap:0;border:1.5px solid var(--border);border-radius:9px;overflow:hidden;background:#FAFAFA}
.exp-who-btn{flex:1;padding:9px 6px;border:none;background:transparent;font-size:.85rem;font-weight:600;cursor:pointer;color:var(--muted);transition:all .15s}
.exp-who-btn.active-ivy{background:#CE93D8;color:#fff}
.exp-who-btn.active-me{background:#80CBC4;color:#fff}
.exp-receipt-area{border:2px dashed var(--border);border-radius:10px;padding:10px;text-align:center;cursor:pointer;background:#FAFAFA;position:relative;min-height:54px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:.82rem;color:var(--muted);font-weight:600}
.exp-receipt-area:hover{border-color:var(--teal);background:var(--mint-light)}
.exp-receipt-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.exp-receipt-preview{width:48px;height:48px;object-fit:cover;border-radius:6px;border:1.5px solid var(--border)}
.exp-form-actions{display:flex;gap:8px;margin-top:12px}
.exp-save-btn{flex:1;padding:10px;background:var(--teal);color:#fff;border:none;border-radius:9px;font-weight:700;cursor:pointer;font-size:.9rem}
.exp-cancel-btn{padding:10px 16px;background:var(--border);color:var(--deep);border:none;border-radius:9px;font-weight:600;cursor:pointer;font-size:.9rem}
.exp-cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.exp-cat-tab{padding:5px 12px;border:1.5px solid var(--border);border-radius:20px;background:#fff;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--muted)}

}
.hero::before{

.hero::after{

const amapTiles = L.tileLayer(
  'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
  {subdomains:['1','2','3','4'],maxZoom:19,attribution:'© 高德地图'}
);
const satTiles = L.tileLayer(
  'https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',
  {subdomains:['1','2','3','4'],maxZoom:19,attribution:'© 高德地图 卫星'}
);

const map = L.map('map',{zoomControl:true,layers:[amapTiles]});
let usingSat = false;
let activeMarkers = [];
let activeDay = 0;

function toggleSatellite(){
  usingSat = !usingSat;
  if(usingSat){ map.removeLayer(amapTiles); map.addLayer(satTiles); }
  else{ map.removeLayer(satTiles); map.addLayer(amapTiles); }
}

// Colour per stop type
const typeColor = {
  transport:'#546E7A', hotel:'#1565C0', activity:'#C62828',
  food:'#E65100', class:'#6A1B9A', night:'#283593'
};

function makeMarker(stop, idx){
  const c = typeColor[stop.type] || '#888';
  const icon = L.divIcon({
    className:'',
    html:`<div class="custom-marker" style="background:${c};width:38px;height:38px;font-size:17px">${stop.icon}</div>`,
    iconSize:[38,38], iconAnchor:[19,19], popupAnchor:[0,-22]
  });
  const m = L.marker(stop.coord, {icon})
    .bindPopup(`<div class="map-pop">
      <div class="pop-name">${stop.name}</div>
      ${stop.nameZh?`<div class="pop-zh">${stop.nameZh}</div>`:''}
      <div class="pop-time">⏰ ${stop.time}</div>
      ${stop.warn?`<div class="pop-warn">${stop.warn.substring(0,100)}…</div>`:''}
      ${stop.amap?`<a href="${stop.amap}" target="_blank">📍 Open in Amap</a>`:''}
    </div>`,{maxWidth:260});
  m.on('click',()=>highlightCard(idx));
  return m;
}

function highlightCard(idx){
  document.querySelectorAll('.act-card').forEach((c,i)=>{
    c.classList.toggle('highlighted', i===idx);
    if(i===idx) c.scrollIntoView({behavior:'smooth',block:'nearest'});
  });
}

function buildNav(){
  const nav = document.getElementById('day-nav');
  DAYS.forEach((d,i)=>{
    const btn = document.createElement('button');
    btn.className = 'dnav-btn' + (i===0?' active':'');
    btn.innerHTML = `<span class="d-date">${d.emoji} ${d.label}</span><span class="d-label">${d.sublabel}</span>`;
    btn.onclick = ()=>selectDay(i);
    nav.appendChild(btn);
  });
  // Separator
  const sep = document.createElement('div');
  sep.className = 'dnav-sep';
  nav.appendChild(sep);
  // Special tabs
  [
    {key:'bookings', emoji:'🍽️', label:'Reservations', sub:'Must Book'},
    {key:'wellness', emoji:'💆', label:'Spa & TCM',    sub:'Wellness'},
    {key:'expenses', emoji:'💰', label:'Expenses',     sub:'Trip Tracker'},
  ].forEach(t=>{
    const btn = document.createElement('button');
    btn.className = 'dnav-btn special-tab';
    btn.id = 'stab-'+t.key;
    btn.innerHTML = `<span class="d-date">${t.emoji} ${t.label}</span><span class="d-label">${t.sub}</span>`;
    btn.onclick = ()=>selectSpecial(t.key);
    nav.appendChild(btn);
  });
}

function selectSpecial(key){
  activeDay = -1;
  document.querySelectorAll('.dnav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('stab-'+key).classList.add('active');
  document.getElementById('stab-'+key).scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  if(key==='bookings') renderBookings();
  else if(key==='wellness') renderWellness();
  else renderExpenses();
}

  {key:'all',       label:'All',       icon:'📋'},
  {key:'food',      label:'Food',      icon:'🍜'},
  {key:'transport', label:'Transport', icon:'🚌'},
  {key:'shopping',  label:'Shopping',  icon:'🛍️'},
  {key:'hotel',     label:'Hotel',     icon:'🏨'},
  {key:'activity',  label:'Activity',  icon:'🎭'},
  {key:'other',     label:'Other',     icon:'💸'},
];

function expLoad(){ try{ return JSON.parse(localStorage.getItem(EXP_KEY)||'[]'); }catch(e){ return []; } }
function expSave(data){ localStorage.setItem(EXP_KEY, JSON.stringify(data)); }
function expImgLoad(id){ return localStorage.getItem(EXP_IMG_PREFIX+id)||null; }
function expImgSave(id, dataUrl){ try{ localStorage.setItem(EXP_IMG_PREFIX+id, dataUrl); }catch(e){ alert('Storage full — image too large, try a smaller photo.'); } }
function expImgDel(id){ localStorage.removeItem(EXP_IMG_PREFIX+id); }

// Compress image via canvas before storing
function compressImage(file, maxPx, quality, cb){
  const reader = new FileReader();
  reader.onload = ev=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxPx/Math.max(img.width,img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*scale);
      c.height = Math.round(img.height*scale);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg', quality));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function renderExpenses(){
  const tl = document.getElementById('timeline');
  activeMarkers.forEach(m=>map.removeLayer(m)); activeMarkers=[];

  // Ensure lightbox exists
  if(!document.getElementById('exp-lightbox')){
    const lb = document.createElement('div');
    lb.id='exp-lightbox';
    lb.innerHTML='<span id="exp-lightbox-close">✕</span><img id="exp-lightbox-img" src="" alt="receipt">';
    document.body.appendChild(lb);
    lb.onclick=e=>{ if(e.target===lb||e.target.id==='exp-lightbox-close') lb.classList.remove('open'); };
  }

  let filterCat = 'all';
  let formOpen = false;
  let formWho = 'me'; // 'ivy' or 'me'
  let pendingImg = null; // compressed data URL before save

  function catIcon(k){ return (EXP_CATS.find(c=>c.key===k)||{icon:'💸'}).icon; }
  function catLabel(k){ return (EXP_CATS.find(c=>c.key===k)||{label:'Other'}).label; }
  function sgd(cny){ return (cny/EXP_RATE).toFixed(0); }

  function render(){
    const data = expLoad();
    const filtered = filterCat==='all' ? data : data.filter(e=>e.cat===filterCat);
    const totalCny = data.reduce((s,e)=>s+e.cny,0);
    const ivyPaid = data.filter(e=>e.who==='ivy').reduce((s,e)=>s+e.cny,0);
    const mePaid  = data.filter(e=>e.who==='me').reduce((s,e)=>s+e.cny,0);
    const fairShare = totalCny/2;
    const ivyBalance = ivyPaid - fairShare; // positive = ivy overpaid = me owes ivy
    const meBalance  = mePaid  - fairShare; // positive = me overpaid = ivy owes me

    let verdictHtml = '';
    if(totalCny===0){
      verdictHtml = `<div class="exp-settle-verdict even">🎒 Add expenses to see who owes who</div>`;
    } else if(Math.abs(ivyBalance)<1){
      verdictHtml = `<div class="exp-settle-verdict even">✅ You're perfectly even!</div>`;
    } else if(ivyBalance>0){
      // Ivy paid more → Me owes Ivy
      verdictHtml = `<div class="exp-settle-verdict me-owes">💚 You owe Ivy ¥${ivyBalance.toFixed(0)} (S$${(ivyBalance/EXP_RATE).toFixed(0)})</div>`;
    } else {
      // Me paid more → Ivy owes Me
      const amt = Math.abs(ivyBalance);
      verdictHtml = `<div class="exp-settle-verdict ivy-owes">💜 Ivy owes you ¥${amt.toFixed(0)} (S$${(amt/EXP_RATE).toFixed(0)})</div>`;
    }

    const catTotals = {};
    data.forEach(e=>{ catTotals[e.cat]=(catTotals[e.cat]||0)+e.cny; });
    const maxCat = Math.max(1,...Object.values(catTotals));

    const byDay = {};
    filtered.forEach(e=>{ if(!byDay[e.day]) byDay[e.day]=[]; byDay[e.day].push(e); });
    const dayLabels = {};
    DAYS.forEach(d=>{ dayLabels[d.key]=d.emoji+' '+d.label; });

    tl.innerHTML = `
      <div class="day-hdr">
        <div class="day-hdr-top">
          <div class="day-badge" style="background:#2B5C52">💰 Expenses</div>
          <div class="day-title-wrap">
            <div class="dt-main">Ivy & Me — Trip Tracker</div>
            <div class="dt-sub">50/50 split · tap receipt to view · saves on device</div>
          </div>
        </div>
      </div>
      <div class="spec-section">
        <div class="exp-rate-note">Exchange rate: 1 SGD ≈ ${EXP_RATE} CNY (estimate)</div>

        <!-- Settlement card -->
        <div class="exp-settle">
          <div class="exp-settle-title">💸 Who Paid What</div>
          <div class="exp-settle-persons">
            <div class="exp-person-card ivy">
              <div class="exp-person-name">🌸 Ivy</div>
              <div class="exp-person-paid">¥${ivyPaid.toFixed(0)}</div>
              <div class="exp-person-share">S$${sgd(ivyPaid)} paid</div>
            </div>
            <div class="exp-settle-arrow">⟺<br><span style="font-size:.65rem">fair share<br>¥${fairShare.toFixed(0)} each</span></div>
            <div class="exp-person-card me">
              <div class="exp-person-name">🙋 Me</div>
              <div class="exp-person-paid">¥${mePaid.toFixed(0)}</div>
              <div class="exp-person-share">S$${sgd(mePaid)} paid</div>
            </div>
          </div>
          ${verdictHtml}
        </div>

        <div class="exp-summary">
          <div class="exp-summary-card highlight">
            <div class="esc-label">Total Spent</div>
            <div class="esc-value">¥${totalCny.toFixed(0)}</div>
            <div class="esc-sub">S$${sgd(totalCny)} total</div>
          </div>
          <div class="exp-summary-card">
            <div class="esc-label">Entries</div>
            <div class="esc-value">${data.length}</div>
            <div class="esc-sub">across ${[...new Set(data.map(e=>e.day))].length} days</div>
          </div>
        </div>

        ${data.length>0?`
        <div class="exp-cat-breakdown">
          <h4>By Category</h4>
          ${EXP_CATS.filter(c=>c.key!=='all'&&catTotals[c.key]).map(c=>`
            <div class="exp-bar-row">
              <div class="exp-bar-label">${c.icon} ${c.label}</div>
              <div class="exp-bar-track"><div class="exp-bar-fill" style="width:${((catTotals[c.key]||0)/maxCat*100).toFixed(0)}%"></div></div>
              <div class="exp-bar-val">¥${(catTotals[c.key]||0).toFixed(0)}</div>
            </div>`).join('')}
        </div>`:''}

        <button class="exp-add-btn" id="exp-add-btn">＋ Add Expense</button>

        <div class="exp-form ${formOpen?'open':''}" id="exp-form">
          <h4>New Expense</h4>
          <div class="exp-row">
            <div>
              <label>Amount (¥ CNY)</label>
              <input type="number" id="ef-cny" placeholder="e.g. 68" min="0" step="0.01">
            </div>
            <div>
              <label>Date</label>
              <select id="ef-day">
                ${DAYS.map(d=>`<option value="${d.key}">${d.emoji} ${d.label}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="exp-row full">
            <div>
              <label>Description</label>
              <input type="text" id="ef-desc" placeholder="e.g. Dan Dan Mian at Chunxi Road">
            </div>
          </div>
          <div class="exp-row">
            <div>
              <label>Category</label>
              <select id="ef-cat">
                ${EXP_CATS.filter(c=>c.key!=='all').map(c=>`<option value="${c.key}">${c.icon} ${c.label}</option>`).join('')}
              </select>
            </div>
            <div>
              <label>Paid by</label>
              <div class="exp-who-toggle" id="ef-who-toggle">
                <button class="exp-who-btn ${formWho==='ivy'?'active-ivy':''}" data-who="ivy">🌸 Ivy</button>
                <button class="exp-who-btn ${formWho==='me'?'active-me':''}" data-who="me">🙋 Me</button>
              </div>
            </div>
          </div>
          <div class="exp-row full">
            <div>
              <label>📷 Receipt photo (optional)</label>
              <div class="exp-receipt-area" id="ef-receipt-area">
                ${pendingImg
                  ? `<img class="exp-receipt-preview" src="${pendingImg}" alt="receipt"><span>Tap to change</span>`
                  : `<span>📷 Tap to upload receipt</span>`}
                <input type="file" id="ef-img" accept="image/*" capture="environment">
              </div>
            </div>
          </div>
          <div class="exp-form-actions">
            <button class="exp-save-btn" id="ef-save">💾 Save</button>
            <button class="exp-cancel-btn" id="ef-cancel">Cancel</button>
          </div>
        </div>

        <div class="exp-cat-tabs">
          ${EXP_CATS.map(c=>`<button class="exp-cat-tab${filterCat===c.key?' active':''}" data-cat="${c.key}">${c.icon} ${c.label}</button>`).join('')}
        </div>

        ${filtered.length===0?`<div class="exp-empty"><div class="empty-icon">🧾</div><div>No expenses yet${filterCat!=='all'?' in this category':''}</div><div style="font-size:.78rem;margin-top:4px">Tap ＋ Add Expense to start</div></div>`:''}

        ${Object.keys(byDay).sort().map(dayKey=>{
          const items = byDay[dayKey];
          const dayTotal = items.reduce((s,e)=>s+e.cny,0);
          return `
          <div class="exp-day-group">
            <div class="exp-day-group-hdr">
              <span>${dayLabels[dayKey]||dayKey}</span>
              <span class="exp-day-total">¥${dayTotal.toFixed(0)} <span style="font-size:.7rem;font-weight:400">≈ S$${sgd(dayTotal)}</span></span>
            </div>
            ${items.map(e=>{
              const imgData = expImgLoad(e.id);
              const half = (e.cny/2).toFixed(0);
              const payerClass = e.who==='ivy'?'ivy':'me';
              const payerLabel = e.who==='ivy'?'🌸 Ivy paid':'🙋 Me paid';
              return `
              <div class="exp-item">
                <div class="exp-item-main">
                  <div class="exp-item-icon">${catIcon(e.cat)}</div>
                  <div class="exp-item-info">
                    <div class="exp-item-name">${e.desc||'—'}</div>
                    <div class="exp-item-meta">
                      <span class="exp-payer-pill ${payerClass}">${payerLabel}</span>
                      <span class="exp-split-row">each ¥${half}</span>
                      ${imgData?'📷':''}
                    </div>
                  </div>
                  <div class="exp-item-amt">
                    <div class="exp-item-cny">¥${e.cny.toFixed(0)}</div>
                    <div class="exp-item-sgd">S$${sgd(e.cny)}</div>
                  </div>
                  <button class="exp-del-btn" data-id="${e.id}" title="Delete">✕</button>
                </div>
                ${imgData?`<img class="exp-item-receipt" src="${imgData}" alt="receipt" data-id="${e.id}">`:''}
              </div>`;
            }).join('')}
          </div>`;
        }).join('')}

        ${data.length>0?`<button class="exp-clear-btn" id="exp-clear">🗑️ Clear all expenses</button>`:''}
      </div>`;

    // ── Wire events ──
    document.getElementById('exp-add-btn').onclick=()=>{ formOpen=!formOpen; if(!formOpen) pendingImg=null; render(); };

    const form = document.getElementById('exp-form');
    if(form){
      // Who toggle
      document.querySelectorAll('[data-who]').forEach(btn=>{
        btn.onclick=()=>{ formWho=btn.dataset.who; render(); };
      });

      // Image upload
      const imgInput = document.getElementById('ef-img');
      if(imgInput) imgInput.onchange=()=>{
        const file = imgInput.files[0];
        if(!file) return;
        compressImage(file, 1000, 0.75, dataUrl=>{ pendingImg=dataUrl; render(); });
      };

      // Save
      document.getElementById('ef-save').onclick=()=>{
        const cny = parseFloat(document.getElementById('ef-cny').value);
        if(!cny||cny<=0){ alert('Enter a valid amount'); return; }
        const id = Date.now().toString();
        const entry = {
          id, cny,
          desc: document.getElementById('ef-desc').value.trim()||'Expense',
          cat: document.getElementById('ef-cat').value,
          day: document.getElementById('ef-day').value,
          who: formWho,
          ts: Date.now()
        };
        if(pendingImg) expImgSave(id, pendingImg);
        const arr = expLoad(); arr.push(entry); expSave(arr);
        formOpen=false; pendingImg=null; render();
      };

      document.getElementById('ef-cancel').onclick=()=>{ formOpen=false; pendingImg=null; render(); };
    }

    // Delete
    document.querySelectorAll('.exp-del-btn').forEach(btn=>{
      btn.onclick=()=>{
        if(!confirm('Delete this entry?')) return;
        expImgDel(btn.dataset.id);
        expSave(expLoad().filter(e=>e.id!==btn.dataset.id));
        render();
      };
    });

    // Category filter
    document.querySelectorAll('.exp-cat-tab').forEach(btn=>{
      btn.onclick=()=>{ filterCat=btn.dataset.cat; render(); };
    });

    // Clear all
    const clearBtn = document.getElementById('exp-clear');
    if(clearBtn) clearBtn.onclick=()=>{
      if(!confirm('Clear ALL expenses? This cannot be undone.')) return;
      expLoad().forEach(e=>expImgDel(e.id));
      expSave([]); render();
    };

    // Receipt lightbox
    document.querySelectorAll('.exp-item-receipt').forEach(img=>{
      img.onclick=()=>{
        document.getElementById('exp-lightbox-img').src=img.src;
        document.getElementById('exp-lightbox').classList.add('open');
      };
    });
  }

  render();
}

// ═══════════════════════════════════════════════════════════
//  SELECT DAY
// ═══════════════════════════════════════════════════════════
function selectDay(i){
  activeDay = i;
  document.querySelectorAll('.dnav-btn').forEach((b,j)=>b.classList.toggle('active',j===i));
  document.querySelectorAll('.dnav-btn')[i].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  renderTimeline(DAYS[i]);
  renderMap(DAYS[i]);
}

// ═══════════════════════════════════════════════════════════
//  RENDER MAP
// ═══════════════════════════════════════════════════════════
function renderMap(day){
  activeMarkers.forEach(m=>map.removeLayer(m));
  activeMarkers = [];
  const validStops = day.stops.filter(s=>s.coord);
  validStops.forEach((stop,idx)=>{
    const m = makeMarker(stop, idx);
    m.addTo(map);
    activeMarkers.push(m);
  });
  if(validStops.length){
    const bounds = L.latLngBounds(validStops.map(s=>s.coord));
    map.fitBounds(bounds, {padding:[40,40], maxZoom:day.zoom||14});
  }
  document.getElementById('map-label').textContent = `📍 ${day.title} — ${day.stops.length} stops`;
}

// ═══════════════════════════════════════════════════════════
//  RENDER TIMELINE
// ═══════════════════════════════════════════════════════════
function renderTimeline(day){
  const tl = document.getElementById('timeline');

  // Hotel bar HTML
  const hotelHtml = day.hotel ? `
    <div class="hotel-bar">
      <div class="hb-icon">🏨</div>
      <div>
        <div class="hb-name">${day.hotel.nameZh}</div>
        <div style="font-size:.78rem;color:#1565C0;font-weight:500">${day.hotel.name}</div>
        <div class="hb-note">${day.hotel.note||''}</div>
      </div>
    </div>` : '';

  // Tips HTML
  const tipsHtml = (day.tips && day.tips.length) ? `
    <div class="tips-box">
      <h4>💡 Today's Tips</h4>
      <ul>${day.tips.map(t=>`<li>${t}</li>`).join('')}</ul>
    </div>` : '';

  // Food section HTML
  const foodHtml = (day.foods && day.foods.length) ? `
    <div class="food-section">
      <div class="section-divider">🥢 What to Eat Today</div>
      <div class="food-scroll">
        ${day.foods.map(f=>`
          <div class="food-card">
            <img class="food-card-img" src="${f.image||''}" loading="lazy" alt="${f.name}" onerror="this.style.background='#f5f0e8';this.style.height='80px'"/>
            <div class="food-card-body">
              <div class="food-card-name">${f.name}</div>
              <div class="food-card-zh">${f.nameZh||''}</div>
              <div class="food-card-desc">${f.desc}</div>
              <div class="food-card-price">${f.price}</div>
            </div>
          </div>`).join('')}
      </div>
    </div>` : '';

  // Activity cards HTML
  const actsHtml = day.stops.map((stop,idx)=>`
    <div class="act-card" onclick="focusStop(${idx})">
      <div class="act-inner">
        <div class="act-left">
          <div class="act-time">${stop.time}</div>
          <div class="act-icon-wrap type-${stop.type}">${stop.icon}</div>
        </div>
        <div class="act-body">
          <div class="act-name-row">
            <div class="act-name">${stop.name}</div>
            ${stop.cost?`<div class="act-cost">${stop.cost}</div>`:''}
          </div>
          ${stop.nameZh?`<div class="act-zh">${stop.nameZh}</div>`:''}
          ${(stop.image && stop.type!=='transport' && stop.type!=='hotel')?`
            <div class="act-img-wrap">
              <img src="${stop.image}" loading="lazy" alt="${stop.name}" onerror="this.parentElement.style.display='none'"/>
            </div>`:''}
          <div class="act-desc">${stop.desc||''}</div>
          ${stop.transport?`<div class="act-transport">🚌 ${stop.transport}</div>`:''}
          ${stop.warn?`<div class="act-warn">${stop.warn}</div>`:''}
          <div class="act-actions">
            ${stop.amap?`<a class="btn-amap" href="${stop.amap}" target="_blank">📍 Open in Amap</a>`:''}
          </div>
        </div>
      </div>
    </div>`).join('');

  const wxHtml = day.weather ? `
    <div class="wx-bar">
      <span class="wx-icon">${day.weather.icon}</span>
      <span class="wx-temp">${day.weather.temp}</span>
      <span class="wx-sep">·</span>
      <span class="wx-chip wx-rain">🌧 ${day.weather.rain} rain</span>
      <span class="wx-chip wx-hum">💧 ${day.weather.humid} humid</span>
      <span class="wx-desc">${day.weather.desc}</span>
    </div>` : '';

  tl.innerHTML = `
    <div class="day-hdr">
      <div class="day-hdr-top">
        <div class="day-badge ${day.badgeClass||''}">${day.label}</div>
        <div class="day-title-wrap">
          <div class="dt-main">${day.title}</div>
          <div class="dt-sub">${day.sub}</div>
        </div>
      </div>
      ${wxHtml}
      ${hotelHtml}
    </div>
    <div class="act-list">${actsHtml}</div>
    ${foodHtml}
    ${tipsHtml}
  `;
}

function focusStop(idx){
  const day = DAYS[activeDay];
  const stop = day.stops[idx];
  if(stop.coord){
    map.flyTo(stop.coord, 15, {duration:1});
    if(activeMarkers[idx]) activeMarkers[idx].openPopup();
  }
  highlightCard(idx);
}

//  INIT
// ═══════════════════════════════════════════════════════════
buildNav();
selectDay(0);
</script>
